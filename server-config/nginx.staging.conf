# =========================================================================================
# STAGING — staging-api.stationly.co.uk
# =========================================================================================
# Captured verbatim from the staging box on 2026-07-31:
#   /etc/nginx/sites-available/api.stationly.co.uk   (file name is historical;
#   it serves staging-api.stationly.co.uk)
#
# Committed because the WebSocket stream DOES NOT WORK without the
# `location = /api/v1/stream` block below, and until now that block existed only
# on the box. Rebuilding staging from the old server-config/nginx.conf would
# reproduce the misleading 401-on-upgrade that cost real debugging time.
#
# Two invariants worth stating explicitly, because both are enforced by the
# ABSENCE of something and are therefore easy to break by addition:
#
#  1. NO catch-all `location /`. That is the only reason `/internal` — the
#     Syncer's write path for board data — is unreachable from the internet.
#     Adding a catch-all (e.g. to serve a landing page) silently exposes it.
#     The loopback + shared-secret checks in internalRoutes.ts still hold as
#     layers 2 and 3, but do not undo the exposure.
#  2. The server-level `proxy_set_header Connection ""` (for upstream keepalive)
#     kills every WebSocket upgrade. Only the exact-match stream location
#     overrides it — and nginx does NOT merge proxy_set_header across levels,
#     so that block must re-declare Host and the whole X-Forwarded-* chain,
#     which `app.set('trust proxy', 1)` depends on.
#
# NOTE: prod (api.stationly.co.uk) has NOT been given the stream block. It must
# be added there before the stream ships to prod. See server-config/nginx.conf
# and docs/LIVE_STREAM_HANDOVER.md.
# =========================================================================================

upstream node_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging-api.stationly.co.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging-api.stationly.co.uk;

    ssl_certificate /etc/letsencrypt/live/staging.stationly.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.stationly.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location = / {
        add_header Cache-Control "no-store" always;
        return 302 https://staging-api.stationly.co.uk/docs;
    }

    # WebSocket live departure stream.
    # Exact-match (=) so only this path overrides the server-level
    # `Connection ""` and 60s read timeout — both of which are correct for REST
    # and fatal for WebSockets.
    location = /api/v1/stream {
        proxy_pass http://node_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # MUST be repeated: nginx does NOT merge proxy_set_header across
        # levels — declaring any header here discards ALL inherited ones,
        # so omitting these would silently drop Host and the X-Forwarded-*
        # chain (which `app.set('trust proxy', 1)` depends on).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/v1/ {
        proxy_pass http://node_backend;
    }

    location /docs {
        proxy_pass http://node_backend;
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy "frame-ancestors https://staging.stationly.co.uk *" always;
    }

    location /openapi.json {
        proxy_pass http://node_backend;
    }

    location /reset-password {
        proxy_pass http://node_backend;
    }

    location /verified {
        proxy_pass http://node_backend;
    }

    location /open {
        proxy_pass http://node_backend;
    }

    location /assets/ {
        proxy_pass http://node_backend;
    }

    location /icons/ {
        proxy_pass http://node_backend;
    }
}
