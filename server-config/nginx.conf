# =========================================================================================
# PRODUCTION vhost — api.stationly.co.uk
# =========================================================================================
#
# ⚠️ THIS FILE IS A MIRROR, NOT A DEPLOYABLE ARTEFACT.
#
# Nothing deploys nginx from this repo. The authoritative copy is on the box at
#   /etc/nginx/sites-available/api.stationly.co.uk
# symlinked from sites-enabled/. Truth flows BOX → REPO. This file exists so the
# running config is reviewable in a diff and so its non-obvious parts are
# explained somewhere durable.
#
# Captured 2026-09-01, verbatim from the running config, with comments added.
# Verify before trusting it:
#   sudo nginx -T | sed -n '/server_name api\.stationly\.co\.uk/,/^}/p'
#
# ── Why the mirror rule matters ──
# The previous version of this file was NOT the live config. It was an older,
# materially worse one: wrong TLS certificate path (api.stationly.co.uk instead
# of the shared stationly.co.uk cert), no upstream keepalive, no security
# headers, no server-level proxy_set_header block, and a `/StationlySyncer/api/v1/admin/`
# block that publicly exposed the Java syncer's admin route. Because it read as
# a reference copy, the obvious move was to scp it onto the box — which would
# have dropped the security headers, broken keepalive, and failed TLS on a
# certificate path that does not exist. A stale reference file is worse than no
# reference file.
#
# ── Traffic split ──
#   Node backend (127.0.0.1:3000) — everything below.
#   Java Syncer  (127.0.0.1:8080) — NOT proxied at all. It has no public
#                                   endpoints and is reached over SSH only.
# =========================================================================================

upstream node_backend {
    server 127.0.0.1:3000;
    # Reuses upstream connections instead of a fresh TCP+handshake per request.
    # Requires `proxy_http_version 1.1` and `proxy_set_header Connection ""` at
    # the server level below — both are present, and the WebSocket location has
    # to override the second of them (see there).
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.stationly.co.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.stationly.co.uk;

    # NOTE the certificate is issued for stationly.co.uk (a shared/SAN cert), not
    # for api.stationly.co.uk. Do not "correct" this path — there is no
    # /etc/letsencrypt/live/api.stationly.co.uk/ directory and nginx would fail
    # to start.
    ssl_certificate /etc/letsencrypt/live/stationly.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stationly.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Server-level proxy defaults ──
    # Inherited by every location that declares NO proxy_set_header of its own.
    # A location that declares even one discards ALL of these — see the stream
    # block, which is why it repeats the whole chain.
    #
    # `app.set('trust proxy', 1)` in server.ts depends on X-Forwarded-For
    # arriving. Without it every unauthenticated request rate-limits against the
    # same 127.0.0.1 bucket.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # EXACT match (`=`), so it catches only the bare root and is NOT a catch-all.
    # See the note at the bottom of this file — that distinction is load-bearing.
    location = / {
        add_header Cache-Control "no-store" always;
        return 302 https://api.stationly.co.uk/docs;
    }

    # WebSocket live departure stream.
    # Exact-match (=) so only this path overrides the server-level
    # `Connection ""` and 60s read timeout — both of which are correct for REST
    # and fatal for WebSockets.
    location = /api/v1/stream {
        proxy_pass http://node_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # MUST be repeated: nginx does NOT merge proxy_set_header across
        # levels — declaring any header here discards ALL inherited ones,
        # so omitting these would silently drop Host and the X-Forwarded-*
        # chain (which `app.set('trust proxy', 1)` depends on).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The server pings every 30s (stationStreamServer.PING_INTERVAL_MS).
        # The inherited 60s read timeout would cull idle boards mid-session.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # The whole public API. Also carries, by prefix and needing no block of its own:
    #   /api/v1/webhooks/stripe        — the contribution webhook (raw body, no API key)
    #   /api/v1/support-money/return   — the post-payment landing page
    #   /api/v1/admin/*                — the admin console API (own admin-key header)
    location /api/v1/ {
        proxy_pass http://node_backend;
    }

    location /docs {
        proxy_pass http://node_backend;
        proxy_hide_header X-Frame-Options;
        # NOTE: the `*` makes the preceding origin redundant — this allows any
        # site to frame /docs. Deliberate-looking (the Scalar UI is embedded) but
        # worth a decision at some point; it is not related to any current work.
        add_header Content-Security-Policy "frame-ancestors https://stationly.co.uk *" always;
    }

    location /openapi.json {
        proxy_pass http://node_backend;
    }

    # Branded browser landing pages served by Express (see server.ts).
    location /reset-password {
        proxy_pass http://node_backend;
    }

    location /verified {
        proxy_pass http://node_backend;
    }

    location /open {
        proxy_pass http://node_backend;
    }

    # public/assets — the transactional-email logo, and content-hashed SDUI media
    # such as widget_guide_medium.png?v=<sha1>.
    location /assets/ {
        proxy_pass http://node_backend;
    }

    # public/icons — TfL roundels, rendered on first hit and cached to disk.
    location /icons/ {
        proxy_pass http://node_backend;
    }
}

# =========================================================================================
# ⛔ THE TWO THINGS THAT MUST NOT CHANGE
# =========================================================================================
#
# 1. NO catch-all `location /` on the 443 block.
#
#    This is the ONLY reason `/internal/*` is unreachable from the internet.
#    Those routes carry the Syncer's live-stream ingest and the two nightly
#    maintenance jobs (sweep / reconcile), and `sweep` can release every
#    account's subscription holds. They are guarded by a loopback check on the
#    RAW socket address plus a constant-time shared secret — but if nginx ever
#    proxies them, the request arrives FROM 127.0.0.1, the loopback check
#    passes, and the only thing left is the secret.
#
#    `location = /` above is an EXACT match and does not count. Anything with a
#    prefix `location /` does. Verify after any edit:
#        sudo nginx -T | grep -nE "^\s*location\s+/\s*\{"      # must be empty
#        curl -sS -o /dev/null -w '%{http_code}\n' https://api.stationly.co.uk/internal/stream-stats
#        # must be 404 from nginx, never 403/503 from Node
#
# 2. NO /kiosk, /kiosk-api/ or /kiosk-stream blocks.
#
#    The café display is a temporary trial and lives on staging only. Its
#    Express handlers are mounted unconditionally in server.ts, so the ONLY
#    thing keeping it off production is the absence of these locations —
#    and /kiosk-api/snapshot/:naptanId is unauthenticated and unmetered.
#    Do not copy them across from nginx.staging.conf.
